<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="프로젝트 대시보드">
<title>나의 프로젝트 대시보드</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --text-sub: #64748b;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --cat-상담: #7c3aed;
    --cat-교육: #2563eb;
    --cat-창작: #ea580c;
    --cat-생산성: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-sub: #94a3b8;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p { color: var(--text-sub); font-size: 0.9rem; margin-top: 4px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
  .card:active { transform: scale(0.97); }
  .icon { font-size: 2.2rem; line-height: 1; }
  .card-name { font-size: 0.95rem; font-weight: 600; }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    color: #fff;
  }
  .badge-상담 { background: var(--cat-상담); }
  .badge-교육 { background: var(--cat-교육); }
  .badge-창작 { background: var(--cat-창작); }
  .badge-생산성 { background: var(--cat-생산성); }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal .m-icon { font-size: 3rem; margin-bottom: 10px; }
  .modal h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
  .modal p { color: var(--text-sub); font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
  .btn-open {
    display: inline-block;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s;
  }
  .btn-open:hover { background: #6d28d9; }
  .btn-open.green { background: var(--cat-생산성); }
  .btn-open.green:hover { background: #15803d; }
  .btn-close {
    display: block;
    margin-top: 12px;
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 0.9rem;
    cursor: pointer;
  }
  .local-note {
    font-size: 0.78rem;
    color: var(--cat-생산성);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>🗂 나의 프로젝트 대시보드</h1>
  <p>박 선생님 전용 · Claude Projects 11 + 로컬 프로그램 1</p>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="m-icon" id="m-icon"></div>
    <h2 id="m-name"></h2>
    <p id="m-desc"></p>
    <div id="m-local-note" class="local-note" style="display:none">⚠️ 이 프로그램은 같은 PC에서 실행 중일 때만 접속 가능합니다.</div>
    <a id="m-link" href="#" target="_blank" class="btn-open">프로젝트 열기</a>
    <button class="btn-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
const gems = [
  { name:'학습상담', icon:'📚', cat:'상담', desc:'학습 관련 상담을 체계적으로 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c81-c809-732c-a9fc-507d66bce89f' },
  { name:'타로상담', icon:'🃏', cat:'상담', desc:'타로카드를 활용한 상담 접근을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c81-f931-7587-94e0-e6985fab3800' },
  { name:'교류분석', icon:'🔄', cat:'상담', desc:'교류분석 이론 기반 상담을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c82-2df8-7521-bb30-5edf38b85287' },
  { name:'종합심리보고서1', icon:'🧾', cat:'상담', desc:'종합심리평가 보고서 작성을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c82-6dd2-71e9-9531-ffe935d9a2f6' },
  { name:'종합심리보고서2', icon:'🧠', cat:'상담', desc:'종합심리보고서 작성을 위한 두 번째 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c82-8f42-718f-b1ef-feac905f4357' },
  { name:'출제교사 분석', icon:'🔍', cat:'상담', desc:'출제 교사 분석을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c82-cf54-73b5-b885-1572af9abff6' },
  { name:'동기유발', icon:'🔥', cat:'상담', desc:'학생 동기유발 상담을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c83-366d-763b-860f-c7ffc1f9687c' },
  { name:'아들상담', icon:'👦', cat:'상담', desc:'아들 상담을 위한 개인 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e8c83-5a8b-731b-a8aa-10d8a33371fe' },
  { name:'인지왜곡 분석', icon:'🧩', cat:'상담', desc:'인지왜곡 분석 및 상담을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e965f-168b-773f-b8fd-e06418a54acd' },
  { name:'비합리적 신념', icon:'💭', cat:'상담', desc:'비합리적 신념 탐색 및 상담을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019e9674-d05f-706f-9df6-ee4442f0914e' },
  { name:'스마트폰 중독 상담', icon:'📱', cat:'상담', desc:'스마트폰 중독 관련 상담을 지원하는 Claude 프로젝트입니다.', url:'https://claude.ai/project/019ecb4c-7fcf-73fc-862b-4229ad33dd3d' },
  { name:'통합사례보고서', icon:'📂', cat:'생산성', desc:'로컬에서 실행되는 통합사례보고서 자동 생성 프로그램입니다. 실행 중일 때만 접속 가능합니다.', url:'http://localhost:8765', local:true },
];

const grid = document.getElementById('grid');
gems.forEach(g => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="icon">${g.icon}</div>
    <div class="card-name">${g.name}</div>
    <span class="badge badge-${g.cat}">${g.cat}</span>
  `;
  card.onclick = () => openModal(g);
  grid.appendChild(card);
});

function openModal(g) {
  document.getElementById('m-icon').textContent = g.icon;
  document.getElementById('m-name').textContent = g.name;
  document.getElementById('m-desc').textContent = g.desc;
  const link = document.getElementById('m-link');
  link.href = g.url;
  link.textContent = g.local ? '프로그램 열기' : '프로젝트 열기';
  link.className = 'btn-open' + (g.local ? ' green' : '');
  document.getElementById('m-local-note').style.display = g.local ? 'block' : 'none';
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('open');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
